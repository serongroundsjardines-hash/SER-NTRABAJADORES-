<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f2a"><link rel="manifest" href="manifest.json"><title>SERÓN TRABAJADORES</title><style>
:root{--green:#173f2a;--light:#eef9e9;--border:#d9e5d7;--bg:#f4f6f2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17231b}header{background:var(--green);color:white;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:3}header img{width:58px;height:42px;object-fit:contain;background:white;border-radius:8px}header b{font-size:19px}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:white;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;display:block}input,select,textarea{width:100%;margin-top:6px;padding:12px;border:1px solid #cfd9cd;border-radius:10px;font:inherit;background:white}textarea{min-height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #c9d5c6;background:white;border-radius:10px;padding:11px 13px;font-weight:700}.primary{background:var(--green);color:white;border-color:var(--green)}.small{font-size:12px;color:#5e6d63}.item{padding:10px 0;border-bottom:1px solid #edf1ec}.notice{background:var(--light);border:1px solid #cfe7c8;border-radius:12px;padding:12px;margin-bottom:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.btn{flex:1 1 45%}}</style></head><body>
<header><img src="logo.png"><div><b>SERÓN TRABAJADORES</b><div style="font-size:12px">SERÓN GROUNDS · Portal de trabajadores</div></div></header><main class="wrap"><div class="notice"><b>Acceso de trabajadores</b><div class="small">Aquí no hay facturas, presupuestos, clientes, gastos, finanzas ni configuración administrativa.</div></div><div id="app"></div></main>
<script>
const SUPABASE_URL='https://vkateeqhqmjbjzicjmnz.supabase.co';
const SUPABASE_KEY='sb_publishable_qAVU4eC6uUeVsHkKPYm0Jw_cbC9TmXO';
const H={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
const esc=(s='')=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const madrid=(d=new Date())=>new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',dateStyle:'short',timeStyle:'short'}).format(d);
function duration(a,b){if(!a||!b)return 'En curso';let m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));return `${Math.floor(m/60)} h ${m%60} min`}
async function api(table,opts={}){let url=SUPABASE_URL+'/rest/v1/'+table+(opts.q||'');let h={...H,...(opts.headers||{})};let r=await fetch(url,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});if(!r.ok)throw new Error((await r.text())||('HTTP '+r.status));let t=await r.text();return t?JSON.parse(t):null}
let workers=[],jobs=[];
async function load(){try{[workers,jobs]=await Promise.all([api('workers',{q:'?select=*&active=eq.true&order=name'}),api('jobs',{q:'?select=*&active=eq.true&order=name'})]);render()}catch(e){app.innerHTML=`<div class=card><h2>Sin conexión</h2><div class=small>${esc(e.message)}</div><div class=actions><button class="btn primary" onclick="load()">Reintentar</button></div></div>`}}
function render(){app.innerHTML=`<div class=card><h2>👷 Mi jornada</h2><div class=grid><label>Trabajador<select id=pworker><option value="">Seleccionar...</option>${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></label><label>Buscar jardín / trabajo<input id=psearch placeholder="Escribe el nombre..."></label><label class=full>Jardín o trabajo<select id=pjob><option value="">Seleccionar...</option>${jobs.map(j=>`<option value="${j.id}" data-search="${esc((j.name+' '+(j.address||'')+' '+(j.job_type||'')).toLowerCase())}">${esc(j.name)} · ${esc(j.job_type||'Trabajo')}${j.address?' · '+esc(j.address):''}</option>`).join('')}</select></label></div><div class=actions><button class="btn primary" id=bin>🟢 Fichar entrada</button><button class=btn id=bout>🔴 Fichar salida</button><button class=btn id=bteam>👥 Equipo aquí</button></div><div id=jobTeamBox></div></div><div class=card><h3>📝 Trabajo / incidencia</h3><div class=grid><label>Resultado<select id=presult><option>Trabajo terminado</option><option>Queda trabajo pendiente</option><option>Incidencia</option><option>Falta material</option></select></label><label class=full>Trabajo realizado / qué falta<textarea id=pnotes placeholder="Explica qué se ha hecho o qué queda pendiente..."></textarea></label><label class=full>Fotos<input id=pphotos type=file accept="image/*" multiple></label></div><div class=actions><button class="btn primary" id=bsave>📸 Guardar y enviar</button></div></div><div class=card><h3>📋 Mis últimos registros</h3><div id=workerRecent class=small>Selecciona tu nombre para verlos.</div></div>`;psearch.oninput=filterJobs;pworker.onchange=showRecent;bin.onclick=clockIn;bout.onclick=clockOut;bteam.onclick=showTeam;bsave.onclick=saveIncident}
function filterJobs(){let q=(psearch.value||'').toLowerCase();[...pjob.options].forEach((o,i)=>{if(i)o.hidden=q&&!String(o.dataset.search||'').includes(q)})}
function job(){return jobs.find(j=>String(j.id)===pjob.value)}
function workerName(id){return esc((workers.find(w=>String(w.id)===String(id))||{}).name||'Trabajador')}
async function clockIn(){if(!pworker.value||!pjob.value)return alert('Selecciona trabajador y jardín/trabajo.');try{let open=await api('clockings',{q:`?select=*&worker_id=eq.${encodeURIComponent(pworker.value)}&exit_time=is.null&limit=1`});if(open.length)return alert('Ya tienes un fichaje abierto. Primero ficha la salida.');await api('clockings',{method:'POST',headers:{Prefer:'return=minimal'},body:{worker_id:Number(pworker.value),job_id:Number(pjob.value),entry_time:new Date().toISOString()}});alert('Entrada registrada: '+job().name);await showRecent();await showTeam()}catch(e){alert('No se pudo registrar: '+e.message)}}
async function clockOut(){if(!pworker.value)return alert('Selecciona el trabajador.');try{let open=await api('clockings',{q:`?select=*&worker_id=eq.${encodeURIComponent(pworker.value)}&exit_time=is.null&order=entry_time.desc&limit=1`});if(!open.length)return alert('No tienes ningún fichaje abierto.');let now=new Date().toISOString();await api('clockings',{method:'PATCH',q:`?id=eq.${open[0].id}`,headers:{Prefer:'return=minimal'},body:{exit_time:now}});alert('Salida registrada. '+duration(open[0].entry_time,now));await showRecent();if(pjob.value&&String(open[0].job_id)===pjob.value)await showTeam()}catch(e){alert('No se pudo registrar: '+e.message)}}
async function showTeam(){if(!pjob.value)return alert('Selecciona primero un jardín o trabajo.');try{let cl=await api('clockings',{q:`?select=*&job_id=eq.${encodeURIComponent(pjob.value)}&order=entry_time.desc&limit=30`});let today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid'}).format(new Date());cl=cl.filter(c=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid'}).format(new Date(c.entry_time))===today);let open=cl.filter(c=>!c.exit_time),done=cl.filter(c=>c.exit_time);jobTeamBox.innerHTML=`<div class=notice style="margin-top:12px"><b>👥 Equipo hoy · ${esc(job().name)}</b>${open.length?open.map(c=>`<div class=item>🟢 <b>${workerName(c.worker_id)}</b><div class=small>Entrada ${madrid(new Date(c.entry_time))} · En curso</div></div>`).join(''):'<div class=small style="margin-top:8px">No hay trabajadores fichados ahora mismo.</div>'}${done.map(c=>`<div class=item>⚪ <b>${workerName(c.worker_id)}</b><div class=small>${madrid(new Date(c.entry_time))} → ${madrid(new Date(c.exit_time))} · ${duration(c.entry_time,c.exit_time)}</div></div>`).join('')}</div>`}catch(e){alert('No se pudo cargar el equipo: '+e.message)}}
function fileData(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function saveIncident(){if(!pworker.value||!pjob.value)return alert('Selecciona trabajador y jardín/trabajo.');if(!pnotes.value.trim()&&![...pphotos.files].length)return alert('Escribe qué se ha realizado, qué falta o añade una foto.');try{let photos=[];for(const f of [...pphotos.files].slice(0,4)){if(f.size>1500000)return alert('Una foto es demasiado grande. Hazla con menor tamaño o usa menos fotos.');photos.push(await fileData(f))}await api('incidents',{method:'POST',headers:{Prefer:'return=minimal'},body:{worker_id:Number(pworker.value),job_id:Number(pjob.value),result:presult.value,notes:pnotes.value.trim(),photos,status:'Pendiente'}});alert('Registro enviado correctamente.');pnotes.value='';pphotos.value='';await showRecent()}catch(e){alert('No se pudo enviar: '+e.message)}}
async function showRecent(){if(!pworker.value){workerRecent.textContent='Selecciona tu nombre para verlos.';return}try{let id=encodeURIComponent(pworker.value);let [cl,inc]=await Promise.all([api('clockings',{q:`?select=*&worker_id=eq.${id}&order=entry_time.desc&limit=5`}),api('incidents',{q:`?select=*&worker_id=eq.${id}&order=created_at.desc&limit=5`})]);let jobName=id=>esc((jobs.find(j=>String(j.id)===String(id))||{}).name||'Trabajo');workerRecent.innerHTML=(cl.map(c=>`<div class=item>⏱️ ${madrid(new Date(c.entry_time))} · ${jobName(c.job_id)} · ${c.exit_time?duration(c.entry_time,c.exit_time):'En curso'}</div>`).join('')+inc.map(r=>`<div class=item><b>${madrid(new Date(r.created_at))} · ${jobName(r.job_id)}</b><div>${esc(r.result||'')}</div><div class=small>${esc(r.notes||'')}</div>${(r.photos||[]).map(p=>`<img src="${p}" style="width:82px;height:82px;object-fit:cover;border-radius:9px;margin:6px">`).join('')}</div>`).join(''))||'Todavía no hay registros.'}catch(e){workerRecent.textContent='No se pudieron cargar los registros.'}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});load();
</script></body></html>
